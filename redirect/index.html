<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Jicaly...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f5;
      color: #18181b;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 90%;
      width: 380px;
    }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Procesando tu pago...</h2>
    <p>Te estamos redirigiendo de vuelta a la aplicación de Jicaly.</p>
    <a id="app-link" href="#" class="btn">Abrir aplicación</a>
  </div>

  <script>
    // Extraer query params de PayPal (token, PayerID)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const payerId = urlParams.get('PayerID');

    // 🔴 CAMBIA ESTE SCHEME SEGÚN TU CASO:
    // Para Development Build / APK de Producción: "jicaly://paypal-success"
    // Para Expo Go en red local: "exp://192.168.1.75:8081/--/paypal-success" (reemplaza IP)
    const APP_SCHEME = "exp://192.168.1.222:8081/--/paypal-success";

    const targetUrl = `${APP_SCHEME}?token=${token || ''}&PayerID=${payerId || ''}`;

    document.getElementById('app-link').href = targetUrl;

    // Intento de redirección automática
    window.location.href = targetUrl;
  </script>
</body>
</html>
